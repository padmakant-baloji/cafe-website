<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>My Orders — Baloji's Cafe</title>
    <meta name="description" content="Track your Baloji's Cafe orders in real time.">
    <meta name="theme-color" content="#15803d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Baloji's Cafe">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/logo/pwa-192.png?v=2">
    <link rel="icon" type="image/png" sizes="512x512" href="/images/logo/pwa-512.png?v=2">
    <link rel="apple-touch-icon" href="/images/logo/apple-touch-icon.png?v=2" sizes="180x180">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=21">
</head>
<body class="order-app app-mobile app-four-tabs">
    <div id="appSplash" class="app-splash" role="status" aria-label="Loading Baloji's Cafe">
        <div class="app-splash-inner">
            <span class="app-splash-badge">
                <span class="app-splash-ring" aria-hidden="true"></span>
                <img src="/images/logo/logo-small.png" alt="" class="app-splash-logo" width="96" height="96" fetchpriority="high" decoding="async">
            </span>
            <span class="app-splash-name">Baloji's Cafe</span>
            <span class="app-splash-tag">Pure veg · Kudachi</span>
            <span class="app-splash-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
    </div>
    <script>
      (function () {
        var hidden = false;
        function hideSplash() {
          if (hidden) return;
          hidden = true;
          var s = document.getElementById('appSplash');
          if (!s) return;
          s.classList.add('app-splash--hide');
          setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 650);
        }
        window.addEventListener('load', function () { setTimeout(hideSplash, 450); });
        setTimeout(hideSplash, 4000);
      })();
    </script>
    <a class="skip-link" href="#ordersList">Skip to orders list</a>
    <div class="app-shell">
        <div class="app-topbar" id="navbar" role="banner">
            <div class="app-topbar-inner">
                <a href="/menu#home" class="app-brand" aria-label="Baloji's Cafe — Home">
                    <span class="app-brand-logo-wrap">
                        <img src="/images/logo/pwa-192.png?v=2" alt="" class="app-brand-logo" width="40" height="40" decoding="async">
                    </span>
                    <span class="app-brand-text">
                        <span class="app-brand-name">Baloji's Cafe</span>
                        <span class="app-brand-sub">Kudachi · Pure Veg</span>
                    </span>
                </a>
                <span class="app-topbar-status" id="topbarStatus">
                    <span class="app-topbar-status-dot"></span>
                    <span class="app-topbar-status-label" id="topbarStatusLabel">Open now</span>
                </span>
            </div>
        </div>

        <section class="order-header app-home-hero" aria-label="My orders overview">
            <div class="order-header-inner">
                <div class="order-header-text">
                    <p class="app-hero-eyebrow">Live status</p>
                    <h1 class="order-header-title">My orders</h1>
                    <p class="order-header-lead">Track your orders in real time.</p>
                    <div class="order-header-actions">
                        <button type="button" class="btn btn-primary order-header-cta app-hero-primary" id="refreshOrdersBtn">
                            <svg class="refresh-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                            Refresh status
                        </button>
                        <a href="/menu" class="btn btn-secondary order-header-cta">Back to menu</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="order-my-orders" aria-label="My orders">
            <div class="container">
                <h2 class="section-title">Recent orders</h2>
                <div class="my-orders-list" id="ordersList" aria-live="polite" tabindex="-1"></div>
            </div>
        </section>
    </div>

    <div id="pwaInstallBanner" class="pwa-install" hidden>
        <div class="pwa-install-inner">
            <div class="pwa-install-title">Install Baloji's Cafe</div>
            <div class="pwa-install-sub">Open the menu faster from your home screen.</div>
            <div class="pwa-install-actions">
                <button type="button" class="btn btn-primary" id="pwaInstallBtn">Install</button>
                <button type="button" class="btn btn-secondary" id="pwaInstallDismissBtn">Not now</button>
            </div>
        </div>
    </div>

    <nav class="app-bottom-nav" aria-label="Primary">
        <a href="/menu#home" class="app-tab" data-app-tab="home">
            <svg class="app-tab-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
            <span class="app-tab-label">Home</span>
        </a>
        <a href="/menu#menu" class="app-tab" data-app-tab="menu">
            <svg class="app-tab-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
            <span class="app-tab-label">Menu</span>
        </a>
        <a href="/orders" class="app-tab active" data-app-tab="orders" aria-current="page">
            <svg class="app-tab-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V6a3 3 0 0 1 6 0v5"/><rect x="5" y="11" width="14" height="10" rx="2"/></svg>
            <span class="app-tab-label">Orders</span>
        </a>
        <a href="/profile" class="app-tab" data-app-tab="profile">
            <svg class="app-tab-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
            <span class="app-tab-label">Profile</span>
        </a>
    </nav>

    <script src="/header-status.js?v=1" defer></script>
    <script src="/orders.js?v=15" defer></script>
    <script src="/review-prompt.js" defer></script>
    <script src="/pwa-client.js" defer></script>
</body>
</html>
