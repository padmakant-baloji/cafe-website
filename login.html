<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#15803d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QuickKart">
    <title>Sign In — QuickKart | Food & Grocery Delivery</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="192x192" href="images/logo/pwa-192.png?v=2">
    <link rel="icon" type="image/png" sizes="512x512" href="images/logo/pwa-512.png?v=2">
    <link rel="apple-touch-icon" href="images/logo/apple-touch-icon.png?v=2" sizes="180x180">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            width: min(100%, 24rem);
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 1.5rem 1.25rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        h1 {
            margin: 0 0 0.35rem;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .lead {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 0 0 1.25rem;
            line-height: 1.45;
        }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #94a3b8;
            margin-bottom: 0.35rem;
        }
        input, select {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f1f5f9;
            font: inherit;
            font-size: 1rem;
            margin-bottom: 0.85rem;
        }
        button {
            width: 100%;
            margin-top: 0.35rem;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: #fff;
            min-height: 44px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: 0.65; cursor: not-allowed; }
        button.is-loading { color: transparent !important; position: relative; pointer-events: none; }
        button.is-loading::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1.15em;
            height: 1.15em;
            margin: -0.575em 0 0 -0.575em;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-top-color: #fff;
            border-radius: 50%;
            animation: btnspin 0.6s linear infinite;
        }
        @keyframes btnspin { to { transform: rotate(360deg); } }
        .error {
            margin-top: 0.75rem;
            font-size: 0.875rem;
            color: #fca5a5;
        }
        .login-legal {
            margin: 1rem 0 0;
            text-align: center;
            font-size: 0.75rem;
        }
        .login-legal a {
            color: #94a3b8;
            text-decoration: none;
        }
        .login-legal a:hover {
            color: #cbd5e1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>QuickKart</h1>
        <p class="lead">Enter your mobile number to continue.</p>

        <section id="gateStepMobile">
            <label for="gateMobile">Mobile number</label>
            <input type="tel" id="gateMobile" inputmode="tel" autocomplete="tel" maxlength="15" placeholder="10-digit mobile (with or without +91)">
            <button type="button" id="gateContinueMobile">Continue</button>
        </section>

        <section id="gateStepProfile" hidden>
            <p class="lead">New customer: name, city, and where we deliver.</p>
            <label for="gateName">Name</label>
            <input type="text" id="gateName" autocomplete="name" maxlength="200" placeholder="Your name">
            <label for="gateCity">City</label>
            <select id="gateCity">
                <option value="">Select your city</option>
                <option value="Kudachi">Kudachi</option>
                <option value="Ugar">Ugar</option>
                <option value="Chinchali">Chinchali</option>
                <option value="Ainapur">Ainapur</option>
                <option value="Gundawad">Gundawad</option>
                <option value="Shiragur">Shiragur</option>
            </select>
            <label for="gateAddress">Delivery address</label>
            <input type="text" id="gateAddress" autocomplete="street-address" maxlength="300" placeholder="House no., street, landmark">
            <button type="button" id="gateRegister">Start ordering</button>
        </section>

        <p class="error" id="gateError" hidden></p>
        <p class="login-legal">
            <a href="/privacy-policy">Privacy Policy</a>
        </p>
    </main>

    <script src="/login.js?v=3" defer></script>
</body>
</html>
