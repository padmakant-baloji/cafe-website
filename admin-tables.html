<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Floor & KOT — Baloji Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0: #f8fafc;
            --bg1: #eef2f7;
            --card: #ffffff;
            --card2: #ffffff;
            --border: rgba(148, 163, 184, 0.55);
            --text: #0f172a;
            --muted: #64748b;
            --accent: #059669;
            --accent2: #0891b2;
            --warn: #d97706;
            --danger: #e11d48;
            --upi: #7c3aed;
            --cash: #ca8a04;
            --radius: 16px;
            --shadow: 0 12px 40px rgba(15, 23, 42, 0.1);
            --surface-muted: #f1f5f9;
            --input-bg: #ffffff;
            --font: 'DM Sans', system-ui, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100%;
            max-width: 100%;
            overflow-x: clip;
        }
        body {
            width: 100%;
            font-family: var(--font);
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(52, 211, 153, 0.1), transparent 55%),
                radial-gradient(900px 500px at 100% 0%, rgba(34, 211, 238, 0.08), transparent 50%),
                linear-gradient(165deg, var(--bg0), var(--bg1) 40%, #fafbfc);
            color: var(--text);
            padding: 1rem;
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }

        .floor-boot {
            max-width: 420px;
            margin: 4rem auto;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 0.9375rem;
        }
        .floor-boot[hidden] { display: none !important; }

        .floor-grid-wrap--loading {
            opacity: 0.72;
            pointer-events: none;
        }

        .floor-auth {
            max-width: 400px;
            margin: 4rem auto;
            padding: 1.75rem;
            border-radius: calc(var(--radius) + 4px);
            border: 1px solid var(--border);
            background: var(--card);
            box-shadow: var(--shadow);
        }
        .floor-auth h2 { font-size: 1.25rem; margin-bottom: 0.35rem; }
        .floor-auth p { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.25rem; line-height: 1.45; }
        .floor-auth label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.35rem; }
        .floor-auth input {
            width: 100%;
            margin-bottom: 0.85rem;
            padding: 0.65rem 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font: inherit;
        }
        .floor-auth button[type="submit"] {
            width: 100%;
            margin-top: 0.25rem;
            padding: 0.75rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9375rem;
            cursor: pointer;
            background: linear-gradient(135deg, #34d399, #22d3ee);
            color: #042f2e;
        }
        .floor-auth-error { margin-top: 0.75rem; font-size: 0.8125rem; color: var(--danger); display: none; }
        .floor-auth-error[data-show="1"] { display: block; }

        .floor-app[hidden] { display: none !important; }
        .floor-top {
            max-width: 1400px;
            margin: 0 auto 1.25rem;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
        }
        .floor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            margin-left: auto;
        }
        .floor-btn {
            font: inherit;
            font-weight: 600;
            font-size: 0.8125rem;
            padding: 0.5rem 0.9rem;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: var(--surface-muted);
            color: var(--text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }
        .floor-btn:hover { background: #e2e8f0; border-color: rgba(100, 116, 139, 0.55); }
        .floor-btn:active { transform: scale(0.98); }
        .floor-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }
        /* Universal button loading spinner (add `is-loading` during async actions). */
        .is-loading {
            color: transparent !important;
            position: relative !important;
            pointer-events: none;
            cursor: progress;
            opacity: 1 !important;
        }
        .is-loading > * { visibility: hidden; }
        .is-loading::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1.1em;
            height: 1.1em;
            margin: -0.55em 0 0 -0.55em;
            border: 2px solid rgba(15, 23, 42, 0.25);
            border-top-color: rgba(15, 23, 42, 0.72);
            border-radius: 50%;
            animation: floor-btn-spin 0.6s linear infinite;
            visibility: visible;
        }
        @keyframes floor-btn-spin { to { transform: rotate(360deg); } }
        .floor-btn--primary {
            border-color: rgba(5, 150, 105, 0.35);
            background: rgba(52, 211, 153, 0.18);
            color: #047857;
        }
        .floor-btn--ghost { background: transparent; }
        .floor-btn--danger {
            border-color: rgba(225, 29, 72, 0.35);
            color: #be123c;
            background: rgba(251, 113, 133, 0.12);
        }
        .floor-btn--danger-outline {
            border-color: rgba(225, 29, 72, 0.35);
            color: #be123c;
            background: transparent;
        }
        .floor-btn--danger-outline:hover {
            background: rgba(251, 113, 133, 0.14);
            border-color: rgba(225, 29, 72, 0.45);
        }

        .kot-form-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .kot-form-toolbar-spacer {
            flex: 1;
            min-width: 0.25rem;
        }
        .kot-kot-rate-hint {
            font-size: 0.75rem;
            color: var(--muted);
            line-height: 1.45;
            margin: 0.55rem 0 0.15rem 0;
        }
        .floor-kot-clear-table {
            margin-top: 0.75rem;
            width: 100%;
        }
        .kot-suggest-online {
            font-size: 0.72em;
            color: var(--muted);
            font-weight: 500;
        }

        .floor-grid-wrap {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
            min-width: 0;
        }
        .floor-btn-label-short { display: none; }
        .floor-section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.65rem;
        }
        .floor-section-head h2 {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
        }
        .floor-section-head span { font-size: 0.75rem; color: var(--muted); }

        .floor-slots {
            display: grid;
            gap: 0.65rem;
        }
        .floor-slots--tables,
        .floor-slots--parcels {
            grid-template-columns: repeat(var(--floor-slot-cols, 4), minmax(0, 1fr));
        }
        @media (max-width: 720px) {
            body {
                padding: 0.55rem max(0.55rem, env(safe-area-inset-right, 0px)) max(1rem, env(safe-area-inset-bottom, 0px)) max(0.55rem, env(safe-area-inset-left, 0px));
            }
            .floor-top,
            .floor-grid-wrap,
            .floor-slots {
                width: 100%;
                max-width: 100%;
                min-width: 0;
            }
            .floor-top {
                margin-bottom: 0.75rem;
            }
            .floor-toolbar {
                width: 100%;
                margin-left: 0;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 0.35rem;
            }
            .floor-toolbar .floor-btn {
                width: 100%;
                min-width: 0;
                justify-content: center;
                padding: 0.45rem 0.3rem;
                font-size: 0.72rem;
            }
            .floor-btn-label-full { display: none; }
            .floor-btn-label-short { display: inline; }
            .floor-slots--tables,
            .floor-slots--parcels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .slot-card {
                min-height: 104px;
                padding: 0.6rem 0.5rem;
                min-width: 0;
            }
            .slot-name { font-size: 0.95rem; }
            .slot-total { font-size: 0.875rem; }
        }

        .slot-card {
            position: relative;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            padding: 0.75rem 0.7rem;
            min-height: 118px;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            cursor: pointer;
            text-align: left;
            color: inherit;
            font: inherit;
            transition: border-color 0.18s, transform 0.12s, box-shadow 0.18s;
        }
        .slot-card:hover:not(:disabled) {
            border-color: rgba(52, 211, 153, 0.45);
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
        }
        .slot-card:active:not(:disabled) { transform: scale(0.99); }
        .slot-card:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .slot-card--busy {
            border-color: rgba(8, 145, 178, 0.4);
            background: linear-gradient(155deg, #ffffff, #f0fdfa 55%);
        }
        .slot-card--busy::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.08), transparent 40%, rgba(34, 211, 238, 0.06));
        }
        .slot-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }
        .slot-name { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; }
        .slot-badge {
            align-self: flex-start;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.45rem;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .slot-badge--free { background: rgba(148, 163, 184, 0.25); color: #475569; }
        .slot-badge--live { background: rgba(52, 211, 153, 0.22); color: #047857; }
        .slot-meta { font-size: 0.75rem; color: var(--muted); margin-top: auto; font-family: var(--mono); }
        .slot-total { font-size: 0.95rem; font-weight: 700; color: #b45309; }

        /* Drawer */
        .floor-drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease;
            z-index: 80;
        }
        .floor-drawer-backdrop[data-open="1"] {
            opacity: 1;
            pointer-events: auto;
        }
        .floor-drawer {
            position: fixed;
            inset: 0;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 100%;
            height: 100%;
            max-height: 100dvh;
            background: linear-gradient(195deg, #ffffff, #f8fafc 55%);
            border: none;
            box-shadow: none;
            z-index: 90;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .floor-drawer[data-open="1"] { transform: translateY(0); }
        .floor-drawer-head {
            flex-shrink: 0;
            padding: 1rem 1rem 0.75rem;
            padding-top: max(1rem, env(safe-area-inset-top));
            border-bottom: 1px solid var(--border);
        }
        .floor-drawer-head-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .floor-drawer-title { font-size: 1.15rem; font-weight: 700; }
        .floor-drawer-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }
        .floor-drawer-close {
            border: none;
            background: var(--surface-muted);
            color: var(--text);
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.25rem;
            line-height: 1;
        }
        .floor-drawer-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            padding: 0;
        }

        .floor-kot-shell {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 0;
            height: 100%;
            min-height: 0;
        }

        .floor-kot-list-col {
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }
        .floor-kot-list-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 1rem 1.1rem;
        }
        .floor-kot-form-col {
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
            border-left: 1px solid var(--border);
            background: var(--surface-muted);
        }
        .floor-kot-form-scroll {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 1rem 1.1rem 0.5rem;
        }
        .floor-kot-form-scroll .add-kot {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            border: none;
            background: transparent;
        }
        .kot-form-footer--fixed {
            flex-shrink: 0;
            padding: 0.75rem 1.1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border);
            background: var(--card);
            box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.08);
        }
        .kot-form-footer--fixed .floor-kot-clear-table {
            width: 100%;
            margin: 0;
        }

        .floor-kot-list-head {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
        }

        .kot-draft-panel {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .kot-draft-lines {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            margin-bottom: 0.65rem;
            min-height: 2.5rem;
        }
        .kot-draft-empty {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.45;
            margin: 0;
        }
        .kot-draft-empty[hidden] {
            display: none !important;
        }
        .kot-draft-line {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.45rem;
            padding: 0.5rem 0.55rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
        }
        .kot-draft-name-cell {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }
        .kot-draft-name {
            min-width: 0;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .kot-draft-price {
            font-size: 0.72rem;
            font-weight: 700;
            color: #b45309;
        }
        .kot-draft-price span {
            color: var(--muted);
            font-weight: 500;
        }
        .kot-draft-qty-wrap {
            display: flex;
            align-items: stretch;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            background: var(--surface-muted);
        }
        .kot-draft-qty-btn {
            flex: 0 0 2rem;
            width: 2rem;
            border: none;
            background: var(--surface-muted);
            color: var(--text);
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            touch-action: manipulation;
        }
        .kot-draft-qty-btn:hover {
            background: #e2e8f0;
        }
        .kot-draft-qty-val {
            flex: 0 0 2.25rem;
            min-width: 2.25rem;
            text-align: center;
            font-size: 0.8125rem;
            font-weight: 700;
            line-height: 2rem;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            background: var(--card);
        }
        .kot-draft-remove {
            flex-shrink: 0;
            flex: 0 0 1.85rem;
            width: 1.85rem;
            height: 1.85rem;
            padding: 0;
            border-radius: 6px;
            border: 1px solid rgba(248, 113, 113, 0.45);
            background: rgba(248, 113, 113, 0.08);
            color: #be123c;
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .kot-draft-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }
        .kot-draft-actions--fixed {
            flex-shrink: 0;
            padding: 0.75rem 1.1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border);
            background: var(--card);
            box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.08);
        }
        .kot-draft-actions--fixed .floor-btn--primary,
        .kot-draft-actions--fixed .floor-btn--ghost {
            flex: 1 1 calc(50% - 0.25rem);
            min-width: 7rem;
            justify-content: center;
        }
        .floor-kot-saved-wrap {
            margin-top: 0.25rem;
        }
        .kot-card-actions {
            padding: 0 0.75rem 0.65rem;
        }
        .kot-card-modify {
            width: 100%;
            justify-content: center;
            font-size: 0.75rem;
            padding: 0.4rem 0.55rem;
        }

        .floor-kot-empty {
            font-size: 0.875rem;
            color: var(--muted);
            line-height: 1.5;
            margin: 0;
        }

        @media (max-width: 720px) {
            .floor-kot-shell {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, 42vh) minmax(0, 1fr);
            }
            .floor-kot-form-col {
                border-left: none;
                border-top: 1px solid var(--border);
            }
        }

        .kot-card {
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--card2);
            overflow: hidden;
        }
        .kot-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.65rem 0.75rem;
            background: var(--surface-muted);
            border-bottom: 1px solid var(--border);
        }
        .kot-card-head strong { font-size: 0.85rem; }
        .kot-lines { padding: 0.5rem 0.75rem 0.65rem; font-size: 0.8125rem; color: var(--text); line-height: 1.45; }
        .kot-lines div { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.15rem 0; }
        .kot-actions { padding: 0.5rem 0.75rem 0.65rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }

        .pill-done {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .pill-done--no { background: rgba(251, 191, 36, 0.22); color: #b45309; }
        .pill-done--yes { background: rgba(52, 211, 153, 0.22); color: #047857; }

        .add-kot {
            border-radius: 14px;
            border: 1px dashed rgba(148, 163, 184, 0.45);
            padding: 0.85rem;
            background: var(--surface-muted);
        }
        .add-kot h3 { font-size: 0.8rem; margin-bottom: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
        .kot-line-inputs-wrap {
            flex-shrink: 0;
            margin-bottom: 0.35rem;
        }
        .kot-line-row {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 0.65rem;
        }
        .kot-line-main {
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 0.45rem 0.55rem;
        }
        .kot-line-name-cell {
            flex: 1 1 14rem;
            min-width: min(100%, 12rem);
            position: relative;
            z-index: 1;
        }
        .kot-line-row--active .kot-name-input {
            border-color: rgba(5, 150, 105, 0.5);
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.14);
        }
        .kot-line-name-cell .kot-name-input {
            width: 100%;
            min-width: 0;
        }
        .kot-qty-wrap {
            flex: 0 0 auto;
            display: flex;
            align-items: stretch;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            background: var(--input-bg);
            align-self: stretch;
        }
        .kot-qty-btn {
            flex: 0 0 2.1rem;
            width: 2.1rem;
            min-width: 2.1rem;
            border: none;
            background: var(--surface-muted);
            color: var(--text);
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        /* ---- Add open / custom item dialog ---- */
        .open-item-modal {
            position: fixed;

            align-items: center;

            padding: 1rem;

            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(2px);

            position: relative;

        /* ============================================================
           Mobile KOT capture — menu is the full-screen primary surface,
           the running order is a slide-up sheet, plus one thumb-friendly
           action bar with live item count, total and a big Save button.
           ============================================================ */
        @media (max-width: 720px) {
            .floor-drawer-head { padding: 0.85rem 0.9rem 0.65rem; padding-top: max(0.85rem, env(safe-area-inset-top)); }
            .floor-drawer-title { font-size: 1.05rem; }
            .floor-drawer-sub { font-size: 0.74rem; }

            .floor-kot-shell {
                display: flex;
                flex-direction: column;
                grid-template-columns: none;
                grid-template-rows: none;
                position: relative;
            }

            /* Menu / add-items becomes the full primary surface */
            .floor-kot-form-col {
                order: 0;
                flex: 1 1 auto;
                min-height: 0;
                border: none;
                background: var(--bg0);
            }
            /* One natural scroll for the whole menu so the search can stay sticky */
            .floor-kot-form-scroll {
                display: block;
                padding: 0 0.85rem 0.85rem;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .floor-kot-form-scroll .add-kot {
                display: block;
                flex: none;
                min-height: 0;
                padding: 0;
                background: transparent;
                border: none;
            }
            .add-kot > h3,
            .add-kot .add-kot-hint { display: none; }

            /* Sticky search bar at the top of the menu */
            .kot-line-inputs-wrap {
                position: sticky;
                top: 0;
                z-index: 6;
                margin: 0 -0.85rem 0.5rem;
                padding: 0.6rem 0.85rem 0.55rem;
                background: linear-gradient(var(--bg0) 80%, rgba(248, 250, 252, 0));
            }
            .kot-line-row { margin-bottom: 0; }
            .kot-line-row input.kot-name-input {
                font-size: 1rem;
                padding: 0.8rem 0.9rem;
                border-radius: 13px;
                box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
            }
            .kot-line-row input.kot-price {
                font-size: 1rem;
                padding: 0.8rem 0.55rem;
                border-radius: 13px;
            }
            .kot-line-main .kot-line-remove { min-height: 2.85rem; border-radius: 13px; }
            .kot-line-meta-row { display: none; }
            .kot-line-row[data-needs-price="1"] .kot-line-meta-row { display: flex; }

            /* Big, two-up, tappable menu chips */
            .kot-menu-browser-wrap { display: block; flex: none; min-height: 0; margin-top: 0; }
            .kot-menu-browser {
                display: block;
                flex: none;
                border: none;
                background: transparent;
                padding: 0;
                min-height: 0;
                overflow: visible;
            }
            .kot-menu-browser-section { margin-bottom: 1rem; }
            .kot-menu-browser-cat { font-size: 0.78rem; margin-bottom: 0.5rem; }
            .kot-menu-browser-items { gap: 0.5rem; }
            .kot-menu-pick {
                flex: 1 1 calc(50% - 0.25rem);
                min-height: 3rem;
                padding: 0.7rem 0.85rem;
                font-size: 0.9rem;
                border-radius: 13px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.4rem;
                background: var(--card);
                box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
            }
            .kot-menu-pick-price { font-size: 0.92rem; margin-left: 0; }
            .kot-preset-chip, .kot-open-pick { min-height: 2.75rem; }

            /* Desktop clear-table footer is hidden; button is relocated into the sheet */
            .kot-form-footer--fixed { display: none; }

            /* Hide the settle hint footer until payment is actually ready */
            #drawerFooter[data-settle="0"] { display: none; }

            /* The running order becomes a slide-up bottom sheet */
            .floor-kot-list-col {
                order: 5;
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                max-height: 86dvh;
                z-index: 96;
                background: var(--card);
                border-top: 1px solid var(--border);
                border-radius: 20px 20px 0 0;
                box-shadow: 0 -18px 48px rgba(15, 23, 42, 0.28);
                transform: translateY(112%);
                transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .floor-kot-list-col.kot-no-anim { transition: none !important; }
            .floor-kot-list-col[data-sheet-open="1"] { transform: translateY(0); }

            .kot-sheet-handle {
                flex-shrink: 0;
                display: grid;
                grid-template-columns: 1fr auto;
                align-items: center;
                gap: 0.5rem;
                padding: 0.85rem 1rem 0.6rem;
                border-bottom: 1px solid var(--border);
                position: relative;
            }
            .kot-sheet-grip {
                position: absolute;
                top: 0.4rem;
                left: 50%;
                transform: translateX(-50%);
                width: 2.6rem;
                height: 0.28rem;
                border-radius: 999px;
                background: rgba(148, 163, 184, 0.6);
            }
            .kot-sheet-title { font-size: 0.95rem; font-weight: 700; }
            .kot-sheet-close {
                border: none;
                background: var(--surface-muted);
                color: var(--text);
                font: inherit;
                font-weight: 700;
                font-size: 0.85rem;
                padding: 0.5rem 0.95rem;
                border-radius: 11px;
                cursor: pointer;
            }
            .floor-kot-list-scroll { padding: 0.75rem 1rem 1rem; }
            .kot-draft-qty-btn { flex: 0 0 2.4rem; width: 2.4rem; font-size: 1.15rem; }
            .kot-draft-qty-val { flex: 0 0 2.5rem; min-width: 2.5rem; line-height: 2.4rem; }
            .kot-draft-line { padding: 0.6rem; }
            .kot-draft-remove { flex: 0 0 2.2rem; width: 2.2rem; height: 2.2rem; }
            .kot-line-served-btn { width: 100%; padding: 0.6rem !important; font-size: 0.85rem !important; }
            .kot-sheet-clear { margin-top: 1rem; }
            .kot-sheet-clear .floor-kot-clear-table { width: 100%; margin: 0; }

            .kot-draft-actions--fixed {
                padding: 0.7rem 1rem calc(0.7rem + env(safe-area-inset-bottom, 0px));
            }
            .kot-draft-actions--fixed .floor-btn { min-height: 3rem; font-size: 0.9rem; }

            .kot-sheet-backdrop {
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.45);
                backdrop-filter: blur(2px);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s ease;
                z-index: 95;
            }
            .kot-sheet-backdrop[data-open="1"] { opacity: 1; pointer-events: auto; }

            /* Persistent thumb-friendly action bar */
            .kot-mobile-bar {
                order: 4;
                flex-shrink: 0;
                display: flex;
                align-items: stretch;
                gap: 0.6rem;
                padding: 0.6rem 0.85rem calc(0.6rem + env(safe-area-inset-bottom, 0px));
                border-top: 1px solid var(--border);
                background: var(--card);
                box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.1);
                z-index: 7;
            }
            .kot-mobile-review {
                flex: 1 1 auto;
                min-width: 0;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
                gap: 0.05rem;
                border: 1px solid var(--border);
                border-radius: 13px;
                background: var(--surface-muted);
                color: var(--text);
                font: inherit;
                padding: 0.4rem 0.85rem;
                cursor: pointer;
                text-align: left;
            }
            .kot-mobile-review-line {
                display: flex;
                align-items: baseline;
                gap: 0.5rem;
                font-weight: 800;
                font-size: 1rem;
            }
            .kot-mobile-total { color: #b45309; }
            .kot-mobile-view { font-size: 0.66rem; color: var(--muted); font-weight: 600; }
            .kot-mobile-save {
                flex: 0 0 auto;
                min-width: 8.5rem;
                justify-content: center;
                font-size: 0.95rem;
                font-weight: 800;
                border-radius: 13px;
            }
            .kot-mobile-bar--pulse .kot-mobile-review { animation: kotBarPulse 0.42s ease; }
            @keyframes kotBarPulse {
                0% { transform: scale(1); }
                40% { transform: scale(1.035); border-color: rgba(5, 150, 105, 0.6); }
                100% { transform: scale(1); }
            }
            .settle-prompt {
                font-size: 0.8125rem;
                font-weight: 700;
                text-align: center;
                color: #047857;
                margin-bottom: 0.45rem;
            }
            .settle-row--ready { animation: settlePulse 0.45s ease; }
            @keyframes settlePulse {
                from { transform: scale(0.98); opacity: 0.6; }
                to { transform: scale(1); opacity: 1; }
            }
            .pay-btn--split { background: linear-gradient(135deg, #ca8a04, #7c3aed); color: #fff; }
            .settle-split-form {
                margin-top: 0.65rem;
                display: grid;
                gap: 0.45rem;
            }
            .settle-split-form label {
                display: grid;
                gap: 0.25rem;
                font-size: 0.75rem;
                font-weight: 600;
            }
            .settle-split-form input {
                font: inherit;
                padding: 0.45rem 0.55rem;
                border-radius: 8px;
                border: 1px solid var(--border);
            }
            .drawer-footer--settle-ready {
                box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.35);
                border-radius: 12px;
                padding: 0.65rem;
            }
        }

        /* KOT thermal print — must live outside mobile breakpoints so print works on all screen sizes */
        #kotPrintArea { display: none; }
        .kot-print-sheet {
            width: 80mm;
            max-width: 80mm;
            margin: 0 auto;
            padding: 2mm 3mm 4mm;
            box-sizing: border-box;
            font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color: #000;
        }
        .kot-print-header { text-align: center; margin-bottom: 2mm; }
        .kot-print-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 1mm;
        }
        .kot-print-address {
            font-size: 12px;
            line-height: 1.35;
            white-space: pre-wrap;
        }
        .kot-print-rule {
            border-top: 1px dashed #000;
            margin: 2mm 0;
        }
        .kot-print-order-meta { text-align: center; }
        .kot-print-meta-line {
            font-size: 13px;
            line-height: 1.35;
            margin-bottom: 0.5mm;
        }
        .kot-print-meta-line--muted { font-size: 12px; }
        .kot-print-table {
            width: 100%;
            border-collapse: collapse;
        }
        .kot-print-table th {
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            padding: 1.2mm 0;
            border-bottom: 1px solid #000;
        }
        .kot-print-table td {
            font-size: 12px;
            padding: 1.4mm 0;
            vertical-align: top;
        }
        .kot-print-item { width: auto; text-align: left; word-break: break-word; }
        .kot-print-qty { width: 10mm; text-align: center; white-space: nowrap; }
        .kot-print-amt { width: 16mm; text-align: right; white-space: nowrap; }
        .kot-print-empty { text-align: center; color: #444; }
        .kot-print-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 3mm;
        }
        .kot-print-footer {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            margin-top: 2mm;
            padding-top: 1mm;
        }
        .kot-print-delivery {
            text-align: center;
            font-size: 12px;
            line-height: 1.4;
            margin-top: 1.5mm;
        }
        @media print {
            @page {
                size: 80mm auto;
                margin: 0;
            }
            body > *:not(#kotPrintArea) {
                display: none !important;
            }
            #kotPrintArea {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
            }
            #kotPrintArea, #kotPrintArea * {
                visibility: visible !important;
            }
            .kot-print-sheet {
                width: 80mm;
                max-width: 80mm;
                padding: 2mm 3mm 4mm;
            }
        }
    </style>
</head>
<body>
    <div class="floor-boot" id="floorBoot" hidden aria-live="polite"></div>

    <div class="floor-auth" id="floorAuth" hidden>
        <h2>Floor &amp; KOT</h2>
        <p>Sign in with the same admin account you use on the main orders screen.</p>
        <form id="floorAuthForm">
            <label for="floorUser">Username</label>
            <input id="floorUser" name="username" autocomplete="username" required>
            <label for="floorPass">Password</label>
            <input id="floorPass" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Continue</button>
        </form>
        <p class="floor-auth-error" id="floorAuthError"></p>
    </div>

    <div class="floor-app" id="floorApp" hidden>
        <header class="floor-top">
            <div class="floor-toolbar">
                <button type="button" class="floor-btn floor-btn--primary" id="floorRefreshBtn" aria-label="Refresh"><span class="floor-btn-label-full">⟳ Refresh</span><span class="floor-btn-label-short">Refresh</span></button>
                <a class="floor-btn floor-btn--ghost" href="/admin"><span class="floor-btn-label-full">← Delivery orders</span><span class="floor-btn-label-short">Orders</span></a>
                <button type="button" class="floor-btn floor-btn--danger" id="floorLogoutBtn"><span class="floor-btn-label-full">Logout</span><span class="floor-btn-label-short">Logout</span></button>
            </div>
        </header>

        <div class="floor-grid-wrap">
            <section>
                <div class="floor-section-head">
                    <h2>Dining tables</h2>
                    <span id="tableCountLabel">—</span>
                </div>
                <div class="floor-slots floor-slots--tables" id="tableSlots" aria-label="Dining tables"></div>
            </section>
            <section>
                <div class="floor-section-head">
                    <h2>Parcel / takeaway</h2>
                    <span id="parcelCountLabel">—</span>
                </div>
                <div class="floor-slots floor-slots--parcels" id="parcelSlots" aria-label="Parcel counters"></div>
            </section>
        </div>
    </div>

    <div class="floor-drawer-backdrop" id="drawerBackdrop" data-open="0"></div>
    <aside class="floor-drawer" id="drawer" data-open="0" aria-hidden="true">
        <div class="floor-drawer-head">
            <div class="floor-drawer-head-row">
                <div>
                    <div class="floor-drawer-title" id="drawerTitle">—</div>
                    <div class="floor-drawer-sub" id="drawerSub">—</div>
                </div>
                <button type="button" class="floor-drawer-close" id="drawerClose" aria-label="Close panel">×</button>
            </div>
        </div>
        <div class="floor-drawer-scroll" id="drawerBody"></div>
        <div class="floor-drawer-footer" id="drawerFooter"></div>
    </aside>

    <div class="toast" id="floorToast" data-show="0"></div>

    <div class="open-item-modal" id="openItemModal" data-open="0" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="openItemTitle">
        <div class="open-item-backdrop" data-open-close="1"></div>
        <div class="open-item-card" role="document">
            <div class="open-item-head">
                <h3 id="openItemTitle">Add open item</h3>
                <button type="button" class="open-item-x" data-open-close="1" aria-label="Close">×</button>
            </div>
            <label class="open-item-field">
                <span>Item name</span>
                <input type="text" id="openItemName" placeholder="e.g. Water bottle" autocomplete="off" autocapitalize="words">
            </label>
            <div class="open-item-grid">
                <label class="open-item-field">
                    <span>Price (₹)</span>
                    <input type="number" id="openItemPrice" min="0" inputmode="numeric" placeholder="0">
                </label>
                <div class="open-item-field">
                    <span>Quantity</span>
                    <div class="open-item-qty" role="group" aria-label="Quantity">
                        <button type="button" class="open-item-qty-btn" data-open-qty="-1" aria-label="Decrease quantity">−</button>
                        <span class="open-item-qty-val" id="openItemQty">1</span>
                        <button type="button" class="open-item-qty-btn" data-open-qty="1" aria-label="Increase quantity">+</button>
                    </div>
                </div>
            </div>
            <p class="open-item-err" id="openItemErr" hidden></p>
            <div class="open-item-actions">
                <button type="button" class="floor-btn floor-btn--ghost" data-open-close="1">Cancel</button>
                <button type="button" class="floor-btn floor-btn--primary" id="openItemAdd">Add to order</button>
            </div>
        </div>
    </div>

    <script src="/admin-auth.js?v=6"></script>
    <script src="/admin-tables.js?v=51"></script>
</body>
</html>
